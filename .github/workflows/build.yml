name: Сборка APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  KATAGO_VERSION: v1.16.4

jobs:
  katago:
    name: KataGo для ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - name: Кэш собранного KataGo
        id: cache
        uses: actions/cache@v4
        with:
          path: out
          key: katago-${{ env.KATAGO_VERSION }}-${{ matrix.abi }}-${{ hashFiles('katago/build-android.sh') }}
      - name: Сборка
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libeigen3-dev ninja-build
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" katago/build-android.sh ${{ matrix.abi }} out
      - uses: actions/upload-artifact@v4
        with:
          name: katago-${{ matrix.abi }}
          path: out/${{ matrix.abi }}/libkatago.so

  apk:
    name: Приложение
    needs: katago
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: katago-*
          path: katago-bin
      - name: Программа KataGo в APK
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mkdir -p app/src/main/jniLibs/$abi
            cp katago-bin/katago-$abi/libkatago.so app/src/main/jniLibs/$abi/
          done
          ls -laR app/src/main/jniLibs
      - name: Нейросеть KataGo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Быстрая сеть b10 (11 МБ) встраивается в APK; сильная b20 (87 МБ) скачивается в приложении по желанию.
          B10=g170e-b10c128-s1141046784-d204142634.bin.gz
          B10_URL=https://github.com/lightvector/KataGo/raw/${KATAGO_VERSION}/cpp/tests/models/$B10
          mkdir -p app/src/main/assets/katago
          curl -fL --retry 3 -o app/src/main/assets/katago/$B10 "$B10_URL"
          B10_SIZE=$(stat -c %s app/src/main/assets/katago/$B10)
          gh api repos/lightvector/KataGo/releases/tags/v1.4.5 \
            --jq '[.assets[] | select(.name | test("^g170e-b20c.*\\.bin\\.gz$")) | {file: .name, url: .browser_download_url, size: .size}]' > b20.json
          jq --arg f "$B10" --arg u "$B10_URL" --argjson s "$B10_SIZE" '[{file: $f, url: $u, size: $s}] + .' b20.json \
            > app/src/main/assets/www/data/models.json
          cat app/src/main/assets/www/data/models.json
          ls -la app/src/main/assets/katago
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          ./gradlew --no-daemon assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GoTrainer-1.0.${{ github.run_number }}.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: GoTrainer-apk
          path: dist/*.apk

  test:
    name: Проверка на эмуляторе Android
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GoTrainer-apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: katago-x86_64
          path: katago-x86_64
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Запуск приложения и KataGo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash tools/emulator-test.sh
      - name: Релиз
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.0.${{ github.run_number }}
          gh release create "$tag" dist/*.apk --target "$GITHUB_SHA" --title "Го — тренер $tag" \
            --notes "Скачайте файл GoTrainer-*.apk ниже (Assets) на телефон и откройте его, чтобы установить. Если Android спросит, разрешите установку из этого источника."
