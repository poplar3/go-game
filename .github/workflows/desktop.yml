name: Сборка для ПК (Windows, Linux)

on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 1.0.${{ github.run_number }}
  PYTHON_VERSION: '3.12'

defaults:
  run:
    working-directory: desktop

jobs:
  windows:
    name: Windows (GoTrainer.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Сборка
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller --noconfirm packaging/gotrainer.spec
      - name: Проверка запуска
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          GOTRAINER_SELFTEST: ${{ github.workspace }}\selftest-windows.png
        run: |
          $p = Start-Process dist\GoTrainer\GoTrainer.exe -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Программа не завершилась за 2 минуты" }
          if (-not (Test-Path $env:GOTRAINER_SELFTEST)) { throw "Программа не запустилась" }
      - name: Архив
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path dist\GoTrainer -DestinationPath out\GoTrainer-$env:VERSION-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GoTrainer-windows
          path: desktop/out/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: selftest-windows
          path: selftest-windows.png

  linux:
    name: Linux (.deb, AppImage)
    # Самая старая из поддерживаемых Ubuntu: так программа пойдёт и на системах новее (glibc 2.35+)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Библиотеки Qt для X11 (попадут внутрь сборки)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxcb-shape0 libxcb-randr0 \
            desktop-file-utils
      - name: Сборка
        run: |
          python -m pip install -r requirements.txt pyinstaller
          NO_VENV=1 PYTHON=python packaging/linux/build_linux.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: GoTrainer-linux
          path: |
            desktop/dist/*.deb
            desktop/dist/*.AppImage

  test-linux:
    name: Проверка .deb и AppImage на Ubuntu 24.04
    needs: linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GoTrainer-linux
          path: dist
      - name: Установка .deb и запуск
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ./dist/*.deb
          GOTRAINER_SELFTEST=$PWD/selftest-deb.png timeout 120 gotrainer
          test -s selftest-deb.png
      - name: Запуск AppImage
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          chmod +x dist/*.AppImage
          sudo apt-get remove -y -q gotrainer
          GOTRAINER_SELFTEST=$PWD/selftest-appimage.png timeout 120 dist/*.AppImage
          test -s selftest-appimage.png
      - uses: actions/upload-artifact@v4
        with:
          name: selftest-linux
          path: selftest-*.png

  release:
    name: Релиз
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [windows, test-linux]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GoTrainer-*
          path: dist
          merge-multiple: true
      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          tag=desktop-v$VERSION
          cat > notes.md <<'TXT'
          Скачайте файл для своей системы ниже (Assets):

          - **Windows 10/11**: `GoTrainer-*-windows-x64.zip`. Распакуйте архив и запустите `GoTrainer\GoTrainer.exe`. Python не нужен.
          - **Ubuntu, Debian, Mint** и похожие: `gotrainer_*_amd64.deb`. Установите командой `sudo apt install ./gotrainer_*_amd64.deb`, игра появится в меню «Игры».
          - **Любой Linux**: `GoTrainer-*-x86_64.AppImage`. Сделайте файл исполняемым (`chmod +x`) и запустите.

          Сильный бот KataGo скачивается в игре: «Настройки → ИИ KataGo… → Скачать KataGo».
          TXT
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --latest=false \
            --title "Го — тренер для ПК $VERSION" --notes-file notes.md
